name: Build and publish Docker image

on:
  # The maintained branch gets a ready-to-pull image after every relevant push.
  push:
    branches:
      - codex/per-account-proxy
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional immutable tag (leave empty to use sha-<commit>)"
        required: false
        default: ""
        type: string

concurrency:
  group: docker-publish-${{ github.ref }}-${{ inputs.image_tag || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  NODE_VERSION: "24"

jobs:
  build:
    name: Build and publish multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine image repository and immutable tag
        id: image
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY_NAME,,}"
          tag="$INPUT_IMAGE_TAG"

          if [[ -z "$tag" ]]; then
            if [[ "$REF_TYPE" == "tag" ]]; then
              tag="${REF_NAME#v}"
            else
              tag="sha-${COMMIT_SHA:0:12}"
            fi
          fi

          if [[ "$tag" == "latest" || ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "image tag must be immutable and may not be latest: $tag" >&2
            exit 1
          fi

          # A branch convenience tag is deliberately mutable. Production docs
          # use the immutable sha/version tag emitted as the primary tag.
          tags="$repository:$tag"
          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "branch" && "$REF_NAME" == "codex/per-account-proxy" ]]; then
            tags+=$'\n'"$repository:branch-codex-per-account-proxy"
          fi

          {
            echo "repository=$repository"
            echo "primary_tag=$tag"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $repository:$tag"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies and run checks
        run: |
          npm ci
          npm run check
          npm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite the primary tag
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.primary_tag }}
        run: |
          set -euo pipefail
          if output="$(docker buildx imagetools inspect "$IMAGE" 2>&1)"; then
            echo "image tag already exists and will not be overwritten: $IMAGE" >&2
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown|no matching manifest|NAME_UNKNOWN|does not exist|404' <<< "$output"; then
            echo "could not verify that the image tag is unused" >&2
            echo "$output" >&2
            exit 1
          fi

      - name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=freebuff2api
            org.opencontainers.image.description=Freebuff OpenAI-compatible API with encrypted account management
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.primary_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Print published image references
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
          PRIMARY_TAG: ${{ steps.image.outputs.primary_tag }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$REPOSITORY:$PRIMARY_TAG" --format '{{.Manifest.Digest}}')"
          echo "Primary image: $REPOSITORY:$PRIMARY_TAG"
          echo "Digest: $digest"
          {
            echo "### Published image"
            echo ''
            echo '```text'
            echo "$REPOSITORY:$PRIMARY_TAG@$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
